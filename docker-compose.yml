services:
  ql-panel:
    build: .
    container_name: ql_manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    environment:
      PANEL_USERNAME: "${PANEL_USERNAME:-admin}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-change-me}"
      SECRET_KEY: "${SECRET_KEY:-change-this-secret-key}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-this-jwt-secret-key}"
      QL_DATA_PATH: "${QL_DATA_PATH:-/home/docker/qinglong}"
      QL_IMAGE: "${QL_IMAGE:-whyour/qinglong:latest}"
      QL0_IMAGE: "${QL0_IMAGE:-whyour/qinglong:debian-python3.10}"
      PANEL_DATA_DIR: /qlpanel/data
      DOCKER_HOST: "${DOCKER_HOST:-unix:///host/run/docker.sock}"
      TZ: "${TZ:-Asia/Shanghai}"
      EXPIRY_SCHEDULER_ENABLED: "${EXPIRY_SCHEDULER_ENABLED:-true}"
      EXPIRY_CHECK_HOUR: "${EXPIRY_CHECK_HOUR:-0}"
      EXPIRY_CHECK_MINUTE: "${EXPIRY_CHECK_MINUTE:-5}"
      EXPIRY_CHECK_INTERVAL: "${EXPIRY_CHECK_INTERVAL:-30}"
    volumes:
      # Mount the parent directory so a Docker daemon restart does not leave
      # the panel attached to a stale Unix socket inode.
      - /run:/host/run:ro
      - ${QL_HOST_DATA_PATH:-/home/docker/qinglong}:${QL_DATA_PATH:-/home/docker/qinglong}
      - ${PANEL_HOST_DATA_PATH:-./data}:/qlpanel/data
      - ${NGINX_HOST_PATH:-/home/docker/nginx}:/home/docker/nginx
    networks:
      - ql_net

networks:
  ql_net:
    external: true
    name: ql_net
